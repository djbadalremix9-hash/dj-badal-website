<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Badal AI Video Generator</title>

  <!-- Puter.js -->
  <script src="https://js.puter.com/v2/"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080b14;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .card {
      background: #111827;
      border: 1px solid #263247;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    textarea,
    select {
      width: 100%;
      border: 1px solid #374151;
      background: #0b1220;
      color: white;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      outline: none;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #generateBtn {
      background: #2563eb;
      color: white;
    }

    #generateBtn:disabled {
      background: #374151;
      cursor: not-allowed;
    }

    #testBtn {
      background: #374151;
      color: white;
    }

    #resetBtn {
      background: #1f2937;
      color: #d1d5db;
    }

    #status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      background: #0b1220;
      color: #d1d5db;
      text-align: center;
      display: none;
    }

    #videoBox {
      display: none;
      margin-top: 25px;
    }

    video {
      width: 100%;
      max-height: 500px;
      border-radius: 14px;
      background: black;
    }

    #downloadBtn {
      background: #16a34a;
      color: white;
    }

    .note {
      margin-top: 18px;
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 500px) {
      .row {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎬 Badal AI Video Generator</h1>

  <div class="subtitle">
    Text से AI Video बनाएं
  </div>

  <div class="card">

    <label for="prompt">Video Prompt</label>

    <textarea
      id="prompt"
      placeholder="Example: A cinematic drone shot flying over a beautiful village at sunset..."
    ></textarea>

    <div class="row">

      <div>
        <label for="ratio">Aspect Ratio</label>

        <select id="ratio">
          <option value="16:9">16:9 Landscape</option>
          <option value="9:16">9:16 Portrait</option>
          <option value="1:1">1:1 Square</option>
        </select>
      </div>

      <div>
        <label for="quality">Quality</label>

        <select id="quality">
          <option value="720p">Standard 720p</option>
          <option value="1080p">HD 1080p</option>
        </select>
      </div>

    </div>

    <label for="duration">Duration</label>

    <select id="duration">
      <option value="4">4 Seconds</option>
      <option value="6">6 Seconds</option>
      <option value="8">8 Seconds</option>
    </select>

    <button id="generateBtn" onclick="generateVideo(false)">
      🎬 Generate Real AI Video
    </button>

    <button id="testBtn" onclick="generateVideo(true)">
      🧪 Test Video (No Credits)
    </button>

    <button id="resetBtn" onclick="resetApp()">
      🔄 Reset
    </button>

    <div id="status"></div>

    <div id="videoBox">

      <video id="videoPlayer" controls playsinline></video>

      <button id="downloadBtn" onclick="downloadVideo()">
        ⬇️ Download Video
      </button>

    </div>

    <div class="note">
      Test Video development/checking के लिए है। Real AI generation
      model के अनुसार credits इस्तेमाल कर सकती है।
    </div>

  </div>

</div>


<script>

let currentVideo = null;


/* Aspect ratio को video size में बदलना */
function getVideoSize(ratio, quality) {

  if (ratio === "9:16") {

    if (quality === "1080p") {
      return "1080x1920";
    }

    return "720x1280";
  }

  if (ratio === "1:1") {

    if (quality === "1080p") {
      return "1080x1080";
    }

    return "720x720";
  }

  if (quality === "1080p") {
    return "1920x1080";
  }

  return "1280x720";
}


/* Video Generate */
async function generateVideo(testMode) {

  const prompt = document.getElementById("prompt").value.trim();

  const ratio = document.getElementById("ratio").value;

  const quality = document.getElementById("quality").value;

  const duration = Number(
    document.getElementById("duration").value
  );

  const generateBtn =
    document.getElementById("generateBtn");

  const testBtn =
    document.getElementById("testBtn");

  const status =
    document.getElementById("status");

  const videoBox =
    document.getElementById("videoBox");

  const videoPlayer =
    document.getElementById("videoPlayer");


  if (!prompt) {

    alert("पहले Video Prompt लिखें।");

    return;
  }


  generateBtn.disabled = true;

  testBtn.disabled = true;

  videoBox.style.display = "none";

  status.style.display = "block";


  if (testMode) {

    status.innerText =
      "🧪 Test video तैयार हो रही है...";

  } else {

    status.innerText =
      "⏳ AI Video generate हो रही है... इसमें कुछ समय लग सकता है।";
  }


  try {

    const size =
      getVideoSize(ratio, quality);


    let video;


    if (testMode) {

      /*
        Test mode:
        credits खर्च नहीं होते
      */

      video = await puter.ai.txt2vid(
        prompt,
        true
      );

    } else {

      /*
        Real AI video
      */

      video = await puter.ai.txt2vid(
        prompt,
        {
          model: "veo-3.1-lite",
          seconds: duration,
          size: size
        }
      );
    }


    currentVideo = video;


    /*
      Puter ready-to-play video element देता है।
    */

    videoPlayer.src = video.src;


    videoBox.style.display = "block";


    status.innerText =
      testMode
      ? "✅ Test video तैयार है!"
      : "✅ AI Video तैयार है!";


    videoPlayer.load();


  } catch (error) {

    console.error(error);


    status.innerText =
      "❌ Video नहीं बन सकी: " +
      (error?.message || error);


    alert(
      "Video generation में error आया।\n\n" +
      (error?.message || error)
    );


  } finally {

    generateBtn.disabled = false;

    testBtn.disabled = false;
  }

}


/* Download */
function downloadVideo() {

  const videoPlayer =
    document.getElementById("videoPlayer");

  if (!videoPlayer.src) {

    alert("पहले video generate करें।");

    return;
  }


  const a =
    document.createElement("a");

  a.href =
    videoPlayer.src;

  a.download =
    "badal-ai-video.mp4";

  document.body.appendChild(a);

  a.click();

  a.remove();
}


/* Reset */
function resetApp() {

  document.getElementById("prompt").value = "";

  document.getElementById("videoBox").style.display =
    "none";

  document.getElementById("status").style.display =
    "none";

  document.getElementById("videoPlayer").src =
    "";

  currentVideo = null;
}

</script>

</body>
</html>
