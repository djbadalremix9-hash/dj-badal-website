<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badal AI Image</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #080b14; color: white; }
    input { width: 80%; max-width: 400px; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    #result img { max-width: 90%; border-radius: 8px; margin-top: 20px; }
  </style>
</head>
<body>

  <h2>Badal AI Image Generator</h2>
  <input type="text" id="promptInput" placeholder="जैसे: Flying car in Mumbai...">
  <br>
  <button onclick="generateImage()">फोटो बनाएं</button>

  <p id="status"></p>
  <div id="result"></div>

  <script>
    async function generateImage() {
      const prompt = document.getElementById('promptInput').value.trim();
      const status = document.getElementById('status');
      const result = document.getElementById('result');

      if (!prompt) return alert("कृपया कुछ लिखें!");

      status.innerText = "फोटो बन रही है, कृपया इंतज़ार करें...";
      result.innerHTML = "";

      try {
        const imageElement = await puter.ai.txt2img(prompt);
        result.appendChild(imageElement);
        status.innerText = "तैयार!";
      } catch (err) {
        status.innerText = "त्रुटि: फोटो नहीं बन पाई।";
      }
    }
  </script>
</body>
</html>
