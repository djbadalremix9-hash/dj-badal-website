<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badal AI Video</title>

  <script src="https://js.puter.com/v2/"></script>

  <style>
    body {
      background: #080b14;
      color: white;
      font-family: Arial;
      padding: 20px;
      text-align: center;
    }

    textarea {
      width: 95%;
      max-width: 600px;
      height: 130px;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 95%;
      max-width: 600px;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    #status {
      margin: 20px;
    }

    video {
      width: 95%;
      max-width: 600px;
      margin-top: 20px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<h1>🎬 Badal AI Video Generator</h1>

<textarea id="prompt"
placeholder="A cute little boy walking in a beautiful village at sunset, cinematic 3D cartoon style"></textarea>

<br>

<button onclick="generateVideo()">
🎬 Generate Video
</button>

<div id="status"></div>

<div id="result"></div>

<script>

async function generateVideo() {

  const prompt =
    document.getElementById("prompt").value.trim();

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  if (!prompt) {
    alert("पहले prompt लिखें");
    return;
  }

  status.innerText =
    "⏳ Video बन रही है... थोड़ा इंतजार करें...";

  result.innerHTML = "";

  try {

    const video =
      await puter.ai.txt2vid(
        prompt,
        {
          model: "vidu/vidu-q3-turbo"
        }
      );

    result.appendChild(video);

    video.controls = true;

    status.innerText =
      "✅ Video तैयार है!";

  } catch (error) {

    console.error(error);

    status.innerText =
      "❌ Error: " +
      (error.message || error);

  }

}

</script>

</body>
</html>
